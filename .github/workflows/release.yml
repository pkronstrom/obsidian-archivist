name: Release

# BRAT and the Obsidian community store both install RELEASE ASSETS by name, so
# the upload step is the point of this workflow: a tag with nothing attached
# installs nothing.
#
# Two kinds of asset ship here:
#   main.js + manifest.json   the plugin, installed by BRAT and the store
#   archivist-<os>-<arch>     the server, for hosts without a Go toolchain
#
# the server is linux/amd64 and has no Go installed, which is the whole reason the
# server binaries are cross-compiled here rather than built on the target.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Server tests
        run: go test ./...

      - name: Cross-compile the server
        run: |
          mkdir -p dist
          # CGO_ENABLED=0 everywhere: everything is pure Go, which is what makes
          # cross-compilation a matter of two environment variables and lets the
          # container image be FROM scratch.
          VER="${GITHUB_REF#refs/tags/}"
          LDFLAGS="-s -w -X github.com/pkronstrom/obsidian-archivist/internal/version.Version=$VER"
          for cmd in $(ls cmd); do
            for target in linux/amd64 linux/arm64 darwin/arm64; do
              os="${target%/*}"; arch="${target#*/}"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags="$LDFLAGS" \
                -o "dist/$cmd-$os-$arch" "./cmd/$cmd"
            done
          done
          cd dist && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the plugin
        run: |
          npm ci
          npm run build

      - name: Release with the assets the plugin installers expect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            main.js manifest.json dist/archivist-* dist/SHA256SUMS
